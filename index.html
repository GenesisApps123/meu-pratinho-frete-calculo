<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Pratinho - Frete</title>

<link rel="stylesheet" href="style.css">

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCaQhII8MY7qBWP8QMv4fyHHUuZ-XG2t14&libraries=places"></script>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Calcular Frete</h1>

<div class="cidade">
📍 Várzea Alegre - CE
</div>

<select id="tipoLocal">

<option value="">
BAIRRO ou SÍTIO
</option>

<option value="bairro">
BAIRRO
</option>

<option value="sitio">
SÍTIO
</option>

</select>

<input
type="text"
id="endereco"
placeholder="Digite a rua/localidade">

<button onclick="usarLocalizacao()">
Usar Minha Localização
</button>

<button onclick="calcularFrete()">
Calcular Frete
</button>

<div class="resultado" id="resultado"></div>

</div>

<script src="script.js"></script>

</body>
</html>
